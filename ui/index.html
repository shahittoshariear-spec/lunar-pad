<!DOCTYPE html>
<html lang="en" data-theme="lunar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Pad</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<!-- ============================================================ icons ====
     One inline sprite, referenced throughout with <use>. Keeping every icon
     in a single place means stroke weight and cap style are set once, so the
     whole icon set stays visually consistent.
     ===================================================================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="g-stroke" fill="none" stroke="currentColor" stroke-width="1.9"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <!-- Each symbol carries the shared stroke attributes. -->
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>

    <path d="M12 5v14M5 12h14"/>

  <symbol id="i-pin" viewBox="0 0 24 24" fill="currentColor">

  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">

  </symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
    <path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h7M15 17h5"/>
    <circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="13" cy="17" r="2"/>
  </symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

  <symbol id="i-more" viewBox="0 0 24 24" fill="currentColor">

  <symbol id="i-palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">

  <symbol id="i-moon" viewBox="0 0 24 24" fill="currentColor">

    <path d="M4 7h12M4 12h8M4 17h5M17.5 7v10M14.5 14l3 3 3-3"/>
  </symbol>
  <symbol id="i-sidebar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/>
  </symbol>

    <path d="M15.5 8.5v-3a1.6 1.6 0 0 0-1.6-1.6h-8.3A1.6 1.6 0 0 0 4 5.5v8.3a1.6 1.6 0 0 0 1.6 1.6h2.9"/>

  <symbol id="i-chevron-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">

  <symbol id="i-corner-down-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.5 5v6a3 3 0 0 1-3 3H5M9 10l-4 4 4 4"/>

<!-- ============================================================== app === -->
<div class="app" id="app">

  <div class="ambient" id="ambient"><canvas id="stars"></canvas></div>

  <header class="titlebar">
    <div class="brand" data-tauri-drag-region>
      <span class="brand-mark"></span>
      <span>Lunar Pad</span>
    </div>
    <div class="titlebar-drag" data-tauri-drag-region></div>
    <div class="titlebar-actions">
      <div class="save-status" id="saveStatus" data-state="idle" title="Everything is written to disk locally">
        <span class="save-dot"></span>
        <span id="saveText">Ready</span>
      </div>
      <button class="win-btn" id="winMin" title="Minimise" aria-label="Minimise">
        <svg><use href="#i-minimise"/></svg>
      </button>
      <button class="win-btn" id="winMax" title="Maximise" aria-label="Maximise">
        <svg><use href="#i-maximise" id="winMaxIcon"/></svg>
      </button>
      <button class="win-btn is-close" id="winClose" title="Close" aria-label="Close">
        <svg><use href="#i-x"/></svg>
      </button>
    </div>
  </header>

  <div class="body">

    <!-- ---------------------------------------------------- sidebar -- -->
    <aside class="sidebar" id="sidebar" aria-label="Notes">
      <div class="sidebar-head">
        <div class="search" id="searchWrap">
          <svg><use href="#i-search"/></svg>
          <input class="input" id="searchInput" type="text" placeholder="Search notes…"
                 autocomplete="off" spellcheck="false" aria-label="Search notes">
          <button class="search-clear" id="searchClear" title="Clear search" aria-label="Clear search">
            <svg><use href="#i-x"/></svg>
          </button>
        </div>
        <div class="foot-row">
          <select class="select" id="sortSelect" title="Sort notes" aria-label="Sort notes">
            <option value="updated">Recent</option>
            <option value="created">Created</option>
            <option value="title">Title</option>
            <option value="size">Length</option>
            <option value="manual">Custom</option>
          </select>
          <span class="toolbar-spacer"></span>
          <button class="btn btn-icon" id="trashToggle" title="Show trash" aria-pressed="false">
            <svg><use href="#i-trash"/></svg>
          </button>
          <button class="btn btn-icon" id="moreBtn" title="More actions" aria-haspopup="menu" aria-expanded="false">
            <svg><use href="#i-more"/></svg>
          </button>
        </div>
      </div>

      <div class="sidebar-scroll" id="noteList" role="listbox" aria-label="Note list"></div>

      <div class="sidebar-foot">
        <button class="btn btn-accent btn-block" id="newNoteBtn">
          <svg><use href="#i-plus"/></svg>
          New note
          <span class="kbd" style="margin-left:auto">Ctrl N</span>
        </button>
        <div class="foot-row">
          <button class="btn btn-icon" id="themeBtn" title="Appearance"><svg><use href="#i-palette"/></svg></button>
          <button class="btn btn-icon" id="focusBtn" title="Focus mode" aria-pressed="false"><svg><use href="#i-target"/></svg></button>
          <button class="btn btn-icon" id="typerBtn" title="Typewriter scrolling" aria-pressed="false"><svg><use href="#i-wrap"/></svg></button>
          <span class="toolbar-spacer"></span>
          <button class="btn btn-icon" id="helpBtn" title="Keyboard shortcuts"><svg><use href="#i-keyboard"/></svg></button>
          <button class="btn btn-icon" id="settingsBtn" title="Settings"><svg><use href="#i-sliders"/></svg></button>
        </div>
      </div>
    </aside>

    <!-- ----------------------------------------------------- editor -- -->
    <main class="editor-pane" id="editorPane">

      <div class="editor-head" id="editorHead">
        <div class="editor-head-row">
          <input class="title-input" id="titleInput" type="text" placeholder="Untitled"
                 autocomplete="off" spellcheck="true" aria-label="Note title">
          <div class="foot-row" id="noteActions">
            <button class="btn btn-icon" id="pinBtn" title="Pin to top (Ctrl+P)" aria-pressed="false">
              <svg><use href="#i-pin"/></svg>
            </button>
            <button class="btn btn-icon" id="duplicateBtn" title="Duplicate (Ctrl+D)">
              <svg><use href="#i-copy"/></svg>
            </button>
            <button class="btn btn-icon" id="exportBtn" title="Export this note">
              <svg><use href="#i-download"/></svg>
            </button>
            <button class="btn btn-icon" id="trashNoteBtn" title="Move to trash (Ctrl+Delete)">
              <svg><use href="#i-trash"/></svg>
            </button>
          </div>
        </div>

        <div class="meta-row">
          <div class="tag-row" id="tagRow"></div>
          <span class="toolbar-spacer"></span>
          <span class="stats" id="stats">0 words</span>
        </div>
      </div>

      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
        <button class="tool" data-cmd="bold" title="Bold (Ctrl+B)"><svg><use href="#i-bold"/></svg></button>
        <button class="tool" data-cmd="italic" title="Italic (Ctrl+I)"><svg><use href="#i-italic"/></svg></button>
        <button class="tool" data-cmd="underline" title="Underline (Ctrl+U)"><svg><use href="#i-underline"/></svg></button>
        <button class="tool" data-cmd="strikeThrough" title="Strikethrough (Ctrl+Shift+X)"><svg><use href="#i-strike"/></svg></button>
        <button class="tool" data-highlight="true" title="Highlight (Ctrl+Shift+H)"><svg><use href="#i-highlight"/></svg></button>

        <span class="toolbar-sep"></span>

        <button class="tool" data-block="h2" title="Heading"><svg><use href="#i-heading"/></svg></button>
        <button class="tool" data-cmd="insertUnorderedList" title="Bulleted list"><svg><use href="#i-ul"/></svg></button>
        <button class="tool" data-cmd="insertOrderedList" title="Numbered list"><svg><use href="#i-ol"/></svg></button>
        <button class="tool" data-block="blockquote" title="Quote"><svg><use href="#i-quote"/></svg></button>
        <button class="tool" data-block="pre" title="Code block"><svg><use href="#i-code"/></svg></button>
        <button class="tool" data-cmd="insertHorizontalRule" title="Divider"><svg><use href="#i-minus"/></svg></button>

        <span class="toolbar-sep"></span>

        <button class="tool" data-cmd="justifyLeft" title="Align left"><svg><use href="#i-align-left"/></svg></button>
        <button class="tool" data-cmd="justifyCenter" title="Align centre"><svg><use href="#i-align-center"/></svg></button>
        <button class="tool" data-cmd="justifyRight" title="Align right"><svg><use href="#i-align-right"/></svg></button>

        <span class="toolbar-sep"></span>

        <select class="select" id="fontSelect" title="Font for this note" aria-label="Font for this note">
          <option value="">Theme font</option>
          <option value="Georgia, 'Times New Roman', serif">Serif</option>
          <option value="Consolas, ui-monospace, monospace">Monospace</option>
          <option value="'Segoe UI Variable Display', Nunito, 'Segoe UI', sans-serif">Rounded</option>
        </select>

        <span class="toolbar-sep"></span>

        <div class="symbol-wrap">
          <button class="tool" id="symbolBtn" title="Insert symbol" aria-haspopup="dialog" aria-expanded="false">
            <svg><use href="#i-lunar"/></svg>
          </button>
          <div class="popup popup-wide popup-down" id="symbolPanel" hidden>
            <div class="popup-head">
              <span class="popup-title">Symbols</span>
              <button class="btn btn-icon" id="symbolClose" title="Close"><svg><use href="#i-x"/></svg></button>
            </div>
            <div class="popup-body" id="symbolBody"></div>
            <div class="popup-foot">
              <span>Tip: type <b>\name</b> then a space — <b>\theta</b> becomes θ</span>
            </div>
          </div>
        </div>

        <span class="toolbar-spacer"></span>

        <button class="tool" id="findBtn" title="Find and replace (Ctrl+F)"><svg><use href="#i-search"/></svg></button>
        <button class="tool" id="clearFormatBtn" title="Clear formatting"><svg><use href="#i-eraser"/></svg></button>
      </div>

      <div class="editor-scroll" id="editorScroll">
        <div class="editor-column">
          <div class="editor-body" id="editorBody" contenteditable="true" spellcheck="true"
               data-placeholder="Start writing. Everything saves as you type."></div>
        </div>
      </div>

      <!-- Find and replace, revealed on demand. -->
      <div class="find-bar" id="findBar" hidden>
        <div class="find-row">
          <svg style="width:14px;height:14px;color:var(--text-faint);flex:none"><use href="#i-search"/></svg>
          <input class="find-input" id="findInput" type="text" placeholder="Find in note…"
                 autocomplete="off" spellcheck="false" aria-label="Find in note">
          <span class="find-count" id="findCount">0/0</span>
          <button class="btn btn-icon" id="findPrev" title="Previous (Shift+Enter)"><svg><use href="#i-chevron-up"/></svg></button>
          <button class="btn btn-icon" id="findNext" title="Next (Enter)"><svg><use href="#i-chevron-down"/></svg></button>
          <button class="btn btn-icon" id="findClose" title="Close (Esc)"><svg><use href="#i-x"/></svg></button>
        </div>
        <div class="find-row" id="replaceRow" hidden>
          <svg style="width:14px;height:14px;color:var(--text-faint);flex:none"><use href="#i-corner-enter"/></svg>
          <input class="find-input" id="replaceInput" type="text" placeholder="Replace with…"
                 autocomplete="off" spellcheck="false" aria-label="Replace with">
          <button class="btn btn-outline" id="replaceOne" title="Replace this match">Replace</button>
          <button class="btn btn-outline" id="replaceAll" title="Replace every match">All</button>
        </div>
      </div>

    </main>
  </div>

  <button class="btn btn-icon reveal-rail" id="revealSidebar" title="Show notes (Ctrl+\)">
    <svg><use href="#i-sidebar"/></svg>
  </button>
</div>

<!-- Slash menu, command palette and modal dialogs are built here. -->
<div id="overlayRoot"></div>
<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
