[package]
name = "lunar-pad"
version = "2.0.0"
description = "A local-first notepad with vertically stacked note tabs"
authors = ["shariearshahittocancode"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "lunar_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
